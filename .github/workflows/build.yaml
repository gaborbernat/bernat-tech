name: Build and deploy
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh project stats before building
        type: boolean
        default: true
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # the top of the hour is the most contended cron slot and GitHub delays or drops runs in it;
    # an off-minute keeps the hourly refresh actually hourly
    - cron: "23 * * * *"

concurrency:
  # keep the event kinds in separate groups so the hourly cron never cancels a push (or vice versa);
  # supersede only within a kind, and never cancel a scheduled run mid-flight
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  refresh:
    # fetch on the hourly cron, on push to main, and on a manual run unless opted out; PR builds
    # (incl. fork PRs with no secrets) skip it and build off the cached numbers
    if: >-
      github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    runs-on: ubuntu-26.04
    environment: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: scripts/*.py
      - name: Restore last refreshed stats
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the previous run's numbers; the fetch merges onto them and keeps any it cannot refresh this time
          path: data/project_stats.json
          key: ${{ runner.os }}-project-stats-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-project-stats-
      - name: Refresh
        # exits non-zero when a record has gone unrefreshed for over three days, which fails the job
        env:
          HUGO_GITHUB_TOKEN: ${{ secrets.HUGO_GITHUB_TOKEN }}
          PEPY: ${{ secrets.PEPY }}
        run: uv run scripts/prefetch_projects.py
      - name: Save refreshed stats
        # save even on failure so the numbers it did manage to refresh carry into the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/project_stats.json
          key: ${{ runner.os }}-project-stats-${{ github.run_id }}

  build:
    needs: refresh
    # build even when refresh is skipped (PR) or fails (>3-day-stale); the site ships the
    # last-good cache while refresh keeps its own status as the staleness alarm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    environment: build
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read Hugo version
        run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Install Dart Sass
        # the SCSS pipeline transpiles with Dart Sass (css.Sass transpiler=dartsass); the extended
        # Hugo binary only bundles the deprecated LibSass, so ship the standalone binary on PATH
        # the sha256 is the digest GitHub lists for the release asset; bump it together with the version
        run: |
          version=1.101.0
          sha256=13c47fe50f707df6d5c2ea8e612ab3ce3b81e351c31f0ebb43072ca7781ad3da
          archive="$RUNNER_TEMP/dart-sass.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/sass/dart-sass/releases/download/${version}/dart-sass-${version}-linux-x64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/dart-sass" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # always npm ci: it checks every package against the lockfile's integrity hashes, which a restored
      # node_modules cache would skip; setup-node's npm cache still keeps the downloads local
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # scripts carry PEP 723 inline deps and there is no lockfile, so key the cache off the scripts
          cache-dependency-glob: scripts/*.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/hugo_cache
            resources/_gen
          key: ${{ runner.os }}-hugo-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-
      - name: Cache rendered mermaid diagrams
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # unchanged diagrams reuse their cached SVG, so the browser is not launched for them
          path: .cache/mermaid
          key: ${{ runner.os }}-mermaid-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-mermaid-
      - name: Restore refreshed project stats
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # exact hit when the refresh job ran this build, else the newest earlier refresh; a full miss builds
          # the tables without stats (the file is not committed) and project-list logs a warning
          path: data/project_stats.json
          key: ${{ runner.os }}-project-stats-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-project-stats-
      - name: Record post publish dates
        run: uv run scripts/publish_dates.py
      - name: Build
        run: hugo --minify --gc
        env:
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}
      - name: Check whether any mermaid diagram needs rendering
        id: mermaid
        run: echo "misses=$(node scripts/mermaid.mjs --check)" >> "$GITHUB_OUTPUT"
      # only restore the 270 MB browser and install it when a diagram actually changed
      - name: Cache the Playwright browser
        if: steps.mermaid.outputs.misses != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium for mermaid rendering
        if: steps.mermaid.outputs.misses != '0'
        run: npx playwright install chromium
      - name: Optimize images
        id: images
        background: true
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq optipng libjpeg-turbo-progs
          find public -name '*.png' -print0 | xargs -0 -r optipng -quiet -o2 -strip all
          find public \( -name '*.jpg' -o -name '*.jpeg' \) -print0 | while IFS= read -r -d '' image; do
            if jpegtran -optimize -progressive -copy none "$image" >"$image.opt" 2>/dev/null; then
              mv "$image.opt" "$image"
            else
              rm -f "$image.opt"
            fi
          done
      - name: Post-process HTML
        run: |
          node scripts/highlight.mjs
          node scripts/mermaid.mjs
      - parallel:
          - name: Validate HTML
            run: java -jar "$(node -p 'String(require("vnu-jar"))')" --errors-only --skip-non-html public
          - name: Subset fonts
            run: uv run scripts/subset-fa.py
      - wait: images
      - name: Report image optimization failure
        if: steps.images.outcome == 'failure'
        run: echo "::warning::image optimization failed"
      - name: Validate RSS feed
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('public/index.xml')"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          # keep /.well-known/security.txt; the action otherwise strips all dot-dirs (.git/.github still excluded)
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    needs:
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
