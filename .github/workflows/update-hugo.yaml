name: Update Hugo Version
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update-hugo:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
      branch: ${{ steps.cpr.outputs.pull-request-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get current Hugo version
        id: current
        run: |
          CURRENT_VERSION=$(cat .hugo-version)
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest Hugo version
        id: latest
        # an unauthenticated, unchecked call turned a rate-limit reply into "null" and a PR bumping Hugo to it
        run: |
          LATEST_VERSION=$(gh api repos/gohugoio/hugo/releases/latest --jq '.tag_name | ltrimstr("v")')
          if [[ ! "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected latest Hugo release tag: $LATEST_VERSION"
            exit 1
          fi
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if update needed
        id: check
        run: |
          if [ "${STEPS_CURRENT_OUTPUTS_VERSION}" != "${STEPS_LATEST_OUTPUTS_VERSION}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_CURRENT_OUTPUTS_VERSION: ${{ steps.current.outputs.version }}
          STEPS_LATEST_OUTPUTS_VERSION: ${{ steps.latest.outputs.version }}

      - name: Update Hugo version
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "${STEPS_LATEST_OUTPUTS_VERSION}" > .hugo-version
        env:
          STEPS_LATEST_OUTPUTS_VERSION: ${{ steps.latest.outputs.version }}

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Bump Hugo from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}
          title: "Bump Hugo from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            ## Update Hugo Version

            This PR updates Hugo from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            ### Changes
            - Updated Hugo version in `.hugo-version`

            ### Release Notes
            https://github.com/gohugoio/hugo/releases/tag/v${{ steps.latest.outputs.version }}

            ---
            🤖 Generated by automated Hugo version update workflow
          branch: update-hugo-${{ steps.latest.outputs.version }}
          delete-branch: true
          labels: |
            dependencies
            automated

  build-bump:
    # a pull_request run from a GITHUB_TOKEN-opened PR waits for approval and never starts, so nothing would
    # build with the new Hugo before the merge deploys it; a workflow_dispatch from the token always runs. Its
    # own job keeps actions: write away from the third-party create-pull-request step.
    needs: update-hugo
    if: needs.update-hugo.outputs.operation == 'created' || needs.update-hugo.outputs.operation == 'updated'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Build the site with the new Hugo
        run: gh workflow run build.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f refresh=false
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.update-hugo.outputs.branch }}
