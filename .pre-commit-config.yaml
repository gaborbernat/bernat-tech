default_language_version:
  python: python3.15
exclude: ^_vendor/|^node_modules/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-case-conflict
  - repo: https://github.com/executablebooks/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120", "--number"]
        # layouts/*.md are Hugo templates (e.g. the raw-markdown output), not prose; reflowing breaks them
        exclude: ^layouts/
        additional_dependencies:
          - mdformat-beautysh==1.0.0
          - mdformat-simple-breaks==0.1.0
          - mdformat-hugo==0.3.4
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      # --isolated keeps a developer's own ruff config from changing what CI enforces
      - id: ruff-check
        args:
          - --fix
          - --isolated
          - --target-version=py313
          - --line-length=120
          - --preview
          - --select=ALL
          # COM812 fights the formatter; the build scripts keep no copyright headers or docstring policy, and
          # S only flags their git/fonttools subprocess calls and https API fetches built from hard-coded hosts
          - --ignore=COM812,CPY,D,S
        files: ^scripts/
      - id: ruff-format
        args: ["--isolated", "--target-version=py313", "--line-length=120", "--preview"]
        files: ^scripts/
  - repo: https://github.com/biomejs/pre-commit
    rev: eb45ebf3cb7c3a872b3ff0814883e8ab81fc451f # frozen: v2.6.4
    hooks:
      - id: biome-check
        args: ["--indent-style=space", "--line-width=120"]
        files: ^scripts/
  - repo: https://github.com/devantler/actionlint
    # Parallel-step support is pending in https://github.com/rhysd/actionlint/pull/695.
    rev: bf6b9188a5fd7b4e7b7d244a865a60165bdc6783
    hooks:
      - id: actionlint
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        args: ["--formatter", "max_line_length=120,retain_line_breaks=true"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
